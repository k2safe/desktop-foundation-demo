[package]
name = "desktop-commerce-demo"
version = "0.1.0"
description = "Desktop Commerce Demo"
edition = "2021"

[lib]
name = "desktop_commerce_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-core-rs = { git = "ssh://git@github.com/k2safe/desktop-foundation.git", rev = "aad418c4f7b5adad961123c7bcda52b87e213bb6", package = "desktop-core-rs", features = ["tauri"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
